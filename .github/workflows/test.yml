name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm ci
      - run: npm test
      - run: npm run build

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - run: swift test

      # swift test only builds for macOS; this catches iOS-only compile breaks.
      - run: xcodebuild build -scheme FlickerDot -destination 'generic/platform=iOS'
